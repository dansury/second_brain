# =============================================================================
# Справочный пример итогового config.yaml (hermes)
# =============================================================================
# ВНИМАНИЕ: этот файл — только для наглядности. На реальном запуске
# docker/entrypoint.sh собирает $HERMES_HOME/config.yaml автоматически из
# переменных окружения (ключи НЕ хранятся в git). Здесь показано, что примерно
# получится при настройках по умолчанию (OpenRouter + Yandex-эмбеддинги).
# =============================================================================

model:
  provider: openrouter
  default: "anthropic/claude-opus-4.6"

# Провайдеры для команды /model. «yandex» — кастомный OpenAI-совместимый
# провайдер: появляется в пикере /model и в `/model --provider yandex`.
providers:
  yandex:
    name: "Yandex Cloud (YandexGPT)"
    base_url: "https://llm.api.cloud.yandex.net/v1"
    key_env: YANDEX_CLOUD_API_KEY
    default_model: "gpt://<YANDEX_CLOUD_FOLDER_ID>/yandexgpt/latest"
    discover_models: false
    models:
      - "gpt://<YANDEX_CLOUD_FOLDER_ID>/yandexgpt/latest"
      - "gpt://<YANDEX_CLOUD_FOLDER_ID>/yandexgpt-lite/latest"

# Голос: Yandex SpeechKit как основной STT/TTS (command-провайдеры).
stt:
  provider: yandex
  providers:
    yandex:
      type: command
      language: "ru-RU"
      command: "/opt/second_brain/speechkit/yc_stt.sh {input_path} {output_path} {language}"
voice:
  auto_tts: true
tts:
  provider: yandex
  providers:
    yandex:
      type: command
      voice: "alena"
      command: "/opt/second_brain/speechkit/yc_tts.sh {input_path} {output_path} {format} {voice}"

# Вторичная LLM-роль: модель суммаризатора авто-сжатия контекста.
auxiliary:
  compression:
    summary_provider: openrouter
    summary_model: "google/gemini-3-flash-preview"

# Тиро-роутинг по сложности входа (плагин hermes-smart-model-routing).
# Пишется в config.yaml при SMART_ROUTING_ENABLED=true (включено по умолчанию;
# отключение — SMART_ROUTING_ENABLED=false). Дополняет, а не дублирует
# ручной /model и cost-флоу слоя 9 (Promts/09 + list_models_by_price): роутер
# выбирает модель автоматически ДО них — дешёвую для коротких заметок, сильную
# для рассуждений и длинного контекста.
smart_model_routing:
  enabled: true
  primary_provider: openrouter
  thresholds:
    cheap:    { max_chars: 500,  max_words: 80,  max_lines: 6 }
    standard: { max_chars: 1800, max_words: 280, max_lines: 18 }
  tiers:
    cheap:        { provider: openrouter, model: "google/gemini-3-flash-preview" }
    standard:     { provider: openrouter, model: "anthropic/claude-opus-4.6" }
    code:         { provider: openrouter, model: "anthropic/claude-opus-4.6" }
    reasoning:    { provider: openrouter, model: "anthropic/claude-opus-4.6" }
    long_context: { provider: openrouter, model: "anthropic/claude-opus-4.6" }

mcp_servers:
  # Долговременная память. Эмбеддинги идут в Yandex Cloud через
  # OpenAI-совместимый эндпоинт (emb://<folder>/text-search-doc/latest).
  gbrain:
    command: gbrain
    args: [serve]
    enabled: true
    timeout: 120
    env:
      GBRAIN_HOME: "/opt/data/gbrain"
      HOME: "/opt/data"
      OPENAI_BASE_URL: "https://llm.api.cloud.yandex.net/v1"
      OPENAI_API_KEY: "<YANDEX_CLOUD_API_KEY>"
      EMBEDDING_MODEL: "openai:emb://<YANDEX_CLOUD_FOLDER_ID>/text-search-doc/latest"

  # Граф знаний по коду (включён по умолчанию; граф зашит в образ).
  grafify:
    command: "/opt/tools/gfx/bin/python"
    args: ["-m", "graphify.serve", "/opt/second_brain/graphify-out/graph.json"]
    enabled: true
    timeout: 120

  # Дневник-консультант (см. ТЗ.md): персоны, запись в Obsidian-vault,
  # feedback (👍👎), список моделей по цене. Инструменты — tools/second-brain-mcp/.
  second-brain:
    command: bun
    args: ["run", "/opt/second_brain/tools/second-brain-mcp/src/index.js"]
    enabled: true
    timeout: 60
    env:
      VAULT_PATH: "/opt/data/vault"
      OPENROUTER_API_KEY: "<OPENROUTER_API_KEY>"

# Многослойный промт конвейера (слои 0-9, ТЗ.md §5) hermes НЕ читает из
# config.yaml — единственная поддерживаемая точка кастомной идентичности
# агента это $HERMES_HOME/SOUL.md. entrypoint.sh собирает его из Promts/*.md
# при каждом старте контейнера (см. ТЗ.md §9/§10.2).
