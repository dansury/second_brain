name: hermes-update

# Авто-проверка обновлений ядра hermes-agent.
#
# Раз в сутки: спросить у Docker Hub, вышла ли новая версия базового образа
# (канал задан в config/hermes/base-image.env) → переставить пин → СОБРАТЬ
# образ на новой версии и прогнать смоук-тесты → открыть PR.
#
# Подтягивание автоматическое, но применяется не молча: обновление доезжает до
# прода мерджем PR, а откат — revert-ом того же PR (или
# `scripts/hermes-update.sh rollback`). Накопленные данные страхует
# docker/entrypoint.sh: при смене версии он снимает состояние тома до старта.

on:
  schedule:
    - cron: "17 4 * * *"   # ежедневно 04:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Конкретный тег вместо самого свежего в канале (например v2026.8.19)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hermes-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли новая версия ядра
        id: check
        run: |
          set +e
          scripts/hermes-update.sh check --github-output
          rc=$?
          set -e
          # 0 — актуально, 10 — есть обновление, иное — сбой проверки.
          case "${rc}" in
            0|10) exit 0 ;;
            *) echo "::error::проверка обновлений не удалась (код ${rc})"; exit "${rc}" ;;
          esac

      - name: Переставить пин на новую версию
        if: steps.check.outputs.update_available == 'true' || inputs.tag != ''
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            scripts/hermes-update.sh update --tag "${{ inputs.tag }}"
          else
            scripts/hermes-update.sh update
          fi
          scripts/hermes-update.sh verify

      - name: Собрать образ на новой версии ядра
        if: steps.check.outputs.update_available == 'true' || inputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: second_brain:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Смоук-тесты ловят то, что видно без ключей: съехавшую команду запуска
      # шлюза, пропавшие инструменты, сломанный рендер config.yaml и отказ
      # страховки данных. Совместимость самой схемы конфига с новой версией
      # ядра проверяет человек при мердже — про это написано в теле PR.
      - name: Смоук-тесты образа
        if: steps.check.outputs.update_available == 'true' || inputs.tag != ''
        run: |
          set -euxo pipefail
          IMAGE=second_brain:candidate

          # 1. Команда запуска из CMD и наши инструменты на месте.
          docker run --rm --entrypoint bash "$IMAGE" -c '
            command -v gateway
            command -v gbrain
            command -v bun
            /opt/tools/gfx/bin/python -m graphify.serve --help >/dev/null 2>&1 || true
            test -x /opt/second_brain/scripts/state-snapshot.sh
            test -x /opt/second_brain/scripts/hermes-update.sh
          '

          # 2. Версия ядра, зашитая в образ, совпадает с пином.
          BAKED="$(docker run --rm --entrypoint cat "$IMAGE" /opt/second_brain/BASE_IMAGE | tr -d '\n')"
          PINNED="$(sed -n 's/^ARG HERMES_BASE_REF=//p' Dockerfile | head -n1)"
          [ "$BAKED" = "$PINNED" ] || { echo "::error::в образе $BAKED, в пине $PINNED"; exit 1; }

          # 3. Entrypoint рендерит валидный config.yaml на новой версии ядра.
          mkdir -p /tmp/smoke && chmod 777 /tmp/smoke
          docker run --rm -v /tmp/smoke:/opt/data \
            -e TELEGRAM_BOT_TOKEN=ci -e OPENROUTER_API_KEY=ci \
            -e YANDEX_CLOUD_API_KEY=ci -e YANDEX_CLOUD_FOLDER_ID=ci \
            --entrypoint bash "$IMAGE" -c 'bash /etc/cont-init.d/50-second-brain'
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('/tmp/smoke/config.yaml')); print('config.yaml: валидный YAML')"
          test -s /tmp/smoke/SOUL.md

          # 4. Страховка данных: смена версии ядра снимает снимок до старта.
          docker run --rm -v /tmp/smoke:/opt/data \
            -e TELEGRAM_BOT_TOKEN=ci -e OPENROUTER_API_KEY=ci \
            -e YANDEX_CLOUD_API_KEY=ci -e YANDEX_CLOUD_FOLDER_ID=ci \
            --entrypoint bash "$IMAGE" -c '
              echo "hermes:previous@sha256:0000" > /tmp/prev
              BASE_IMAGE_FILE=/tmp/prev bash /etc/cont-init.d/50-second-brain
              bash /opt/second_brain/scripts/state-snapshot.sh create ci-upgrade
              bash /opt/second_brain/scripts/state-snapshot.sh verify last
            '
          test -d /tmp/smoke/backups

      - name: Открыть PR с обновлением
        if: steps.check.outputs.update_available == 'true' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(sed -n 's/^HERMES_IMAGE_TAG=//p' config/hermes/base-image.env)"
          BRANCH="chore/hermes-${TAG}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add Dockerfile config/hermes/base-image.env config/hermes/base-image.history
          git commit \
            -m "chore(hermes): обновить ядро до ${TAG}" \
            -m "Пин базового образа переставлен автоматически (workflow hermes-update): образ собран и прошёл смоук-тесты на новой версии ядра. Откат: revert этого PR или scripts/hermes-update.sh rollback."
          git push -u origin "${BRANCH}" --force-with-lease

          if gh pr view "${BRANCH}" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR для ${BRANCH} уже открыт — ветка обновлена."
            exit 0
          fi

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${BRANCH}" \
            --title "chore(hermes): обновить ядро до ${TAG}" \
            --body "$(cat <<EOF
          Автообновление ядра **hermes-agent** до \`${TAG}\`.

          | | |
          |---|---|
          | Было | \`${{ steps.check.outputs.current_tag }}\` (\`${{ steps.check.outputs.current_digest }}\`) |
          | Стало | \`${TAG}\` (\`${{ steps.check.outputs.target_digest }}\`) |

          ## Что проверено автоматически
          - образ собран на новой версии ядра;
          - \`gateway\`, \`gbrain\`, \`bun\`, graphify на месте (команда запуска не съехала);
          - \`entrypoint\` отрендерил валидный \`config.yaml\` и собрал \`SOUL.md\`;
          - страховка данных сработала: смена версии ядра снимает снимок тома до старта.

          ## Что проверяет человек перед мерджем
          Смоук-тесты идут без реальных ключей, поэтому вне их охвата остаётся
          совместимость новой версии ядра с накопленным состоянием: схема
          \`config.yaml\`, формат состояния шлюза, поведение MCP-серверов. Стоит
          посмотреть changelog апстрима, а после деплоя — проверить в Telegram
          текст, голос и поиск по памяти.

          ## Откат
          - версия ядра: revert этого PR либо \`scripts/hermes-update.sh rollback\`;
          - данные: \`bash /opt/second_brain/scripts/state-snapshot.sh restore last\`
            в контейнере (снимок «до обновления» делается автоматически).

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )"
